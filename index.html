<style>
  :root {
    --bg: #F7FBF9;
    --surface: #FFFFFF;
    --surface-hover: #EDF8FA;
    --border: #DDEFF2;
    --border-strong: #BFE1E6;
    --text: #223338;
    --text-muted: #5E7378;
    --text-faint: #93A6AA;
    --accent: #68D2DF;
    --accent-strong: #1D7E8C;
    --accent-soft: #E6F8FA;
    --sky: #8FC4DE;
    --sky-strong: #3A7CA5;
    --sky-soft: #EAF5FA;
    --warn: #C99A5C;
    --warn-soft: #FBF2E4;
    --danger: #C97A72;
    --danger-soft: #FBEDEB;
    --shadow: 0 1px 2px rgba(38, 58, 52, 0.04), 0 6px 20px rgba(38, 58, 52, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1517;
      --surface: #122024;
      --surface-hover: #172A2E;
      --border: #1F3A3F;
      --border-strong: #2C4F55;
      --text: #E4F3F5;
      --text-muted: #93ADB2;
      --text-faint: #607A7F;
      --accent: #68D2DF;
      --accent-strong: #7BD8E3;
      --accent-soft: #163238;
      --sky: #8FC4DA;
      --sky-strong: #9ED2EA;
      --sky-soft: #1B333C;
      --warn: #D3A468;
      --warn-soft: #362B1B;
      --danger: #D9928A;
      --danger-soft: #3A2320;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0D1517;
    --surface: #122024;
    --surface-hover: #172A2E;
    --border: #1F3A3F;
    --border-strong: #2C4F55;
    --text: #E4F3F5;
    --text-muted: #93ADB2;
    --text-faint: #607A7F;
    --accent: #68D2DF;
    --accent-strong: #7BD8E3;
    --accent-soft: #163238;
    --sky: #8FC4DA;
    --sky-soft: #1B333C;
    --warn: #D3A468;
    --warn-soft: #362B1B;
    --danger: #D9928A;
    --danger-soft: #3A2320;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: clamp(20px, 4vw, 56px) clamp(16px, 5vw, 64px) 96px;
  }

  .wrap { max-width: 960px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header.page { margin-bottom: 28px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    letter-spacing: 0.08em;
    color: var(--accent-strong);
    background: var(--accent-soft);
    padding: 4px 12px 4px 10px;
    border-radius: 999px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .eyebrow svg { width: 13px; height: 13px; }

  h1 {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 4vw, 34px);
    margin: 0 0 8px;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }

  .subtitle { color: var(--text-muted); font-size: 15px; max-width: 62ch; margin: 0; }

  /* ---------- Stat tiles ---------- */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 24px 0 20px; }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .stat .label { font-size: 12px; color: var(--text-faint); letter-spacing: 0.04em; margin-bottom: 6px; }
  .stat .value {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(16px, 2.4vw, 20px);
    font-weight: 600;
    color: var(--text);
  }
  .stat .value small { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-left: 3px; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }

  .search { position: relative; flex: 1 1 220px; }
  .search input {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px 10px 36px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search input:focus { border-color: var(--accent-strong); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-faint); pointer-events: none; }

  .yearfilter { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
  .yearfilter button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .yearfilter button:hover { color: var(--text); }
  .yearfilter button.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }

  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .btn:hover { color: var(--text); border-color: var(--accent); }
  .btn svg { width: 14px; height: 14px; }

  .btn-primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
  .btn-primary:hover { background: var(--accent-strong); filter: brightness(1.06); color:#fff; }
  .btn-primary:disabled { opacity: .45; cursor: default; }
  .btn-primary:disabled:hover { filter: none; }

  .btn-ghost-accent { color: var(--accent-strong); border-color: var(--accent-soft); background: var(--accent-soft); }
  .btn-ghost-accent:hover { border-color: var(--accent-strong); }

  .btn-danger-soft { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-soft); }
  .btn-danger-soft:hover { border-color: var(--danger); }

  .dirty-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); display: inline-block; margin-left: 2px; }

  /* ---------- Section labels ---------- */
  .section-label {
    display: flex; align-items: center; gap: 10px; margin: 30px 0 12px;
    color: var(--text-faint); font-size: 12.5px; letter-spacing: 0.06em;
    font-family: "IBM Plex Mono", monospace;
    grid-column: 1 / -1;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* ---------- Paused-items section (collapsed by default) ---------- */
  .pause-section {
    grid-column: 1 / -1;
    margin: 30px 0 0;
  }
  .pause-summary {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    list-style: none; -webkit-tap-highlight-color: transparent;
    color: var(--text-faint); font-size: 12.5px; letter-spacing: 0.06em;
    font-family: "IBM Plex Mono", monospace;
    padding: 6px 0; user-select: none;
  }
  .pause-summary::-webkit-details-marker { display: none; }
  .pause-summary::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .pause-caret { display: inline-block; transition: transform .15s ease; color: var(--text-faint); }
  .pause-section[open] .pause-caret { transform: rotate(90deg); }
  /* The .grid class also sets display:grid on this element, which (being
     author CSS) would otherwise override the browser's built-in "hide
     everything but <summary> while closed" behavior for <details>. Pin it
     explicitly here so the paused cards actually stay hidden while collapsed. */
  .pause-section > .pause-grid { display: none; margin-top: 12px; }
  .pause-section[open] > .pause-grid { display: grid; }

  /* ---------- Per-product "細項說明" (MOQ/尺寸/材質/打樣天數/大貨天數/報價/備註) ----------
     Visually separated from the cost items table via a soft mint tint (same
     accent used for tags/highlights elsewhere), collapsed by default so it
     doesn't compete with the cost figures that are the page's main purpose. */
  .spec-section {
    margin-top: 14px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .spec-summary {
    display: flex; align-items: center; gap: 8px; cursor: pointer;

  .specs-edit-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }

  .specs-edit-table td { padding: 0 6px; vertical-align: top; }

  /* ---------- Product grid (view mode) ---------- */

  .pcard {

  .pcard-name { padding: 0 16px; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 700; font-size: 14.5px; color: var(--text); text-wrap: balance; }

  .chip-dev { background: var(--warn-soft); color: var(--warn); font-weight: 600; }

  .price-block { padding: 0 16px; text-align: left; }

  .price-primary .unit-suffix { font-family: "Noto Sans TC", sans-serif; font-weight: 400; font-size: 11px; color: var(--text-faint); margin-left: 2px; }
  .price-primary.missing { color: var(--warn); font-family: "Noto Sans TC", sans-serif; font-size: 13px; }
  .price-secondary { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--text-faint); white-space: nowrap; }

  .card-body { border-top: 1px solid var(--border); padding: 12px 18px 16px; }

  /* Per-item edit / close buttons overlaid on a card, top-right */
  .item-edit-btn {

  .table-scroll { overflow-x: auto; }
  table.items { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  table.items thead th { text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: 0.03em; color: var(--text-faint); padding: 10px 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.items thead th.num { text-align: right; }
  table.items tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }

  .no-results { text-align: center; color: var(--text-faint); padding: 40px 0; font-size: 14px; display: none; }

  /* ---------- Single-item edit form ---------- */
  .card-edit {
    position: relative;
    grid-column: 1 / -1;
    background: var(--surface);
    border: 1px solid var(--accent-soft);

  .ipt-readonly {

  .row-del, .card-del {

  .items-edit-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; margin-top: 6px; }
  .items-edit-table th { text-align: left; font-size: 11px; color: var(--text-faint); letter-spacing: .03em; padding: 0 6px 2px; font-weight: 600; }
  .items-edit-table td { padding: 0 6px; vertical-align: top; }
  .items-edit-table col.c-drag { width: 26px; }

  .items-edit-table col.c-rmb { width: 10%; }
  .items-edit-table col.c-twd { width: 10%; }
  .items-edit-table col.c-unit { width: 10%; }
  .items-edit-table col.c-date { width: 9%; }
  .items-edit-table col.c-note { width: 25%; }
  .items-edit-table col.c-del { width: 34px; }

  /* Drag-to-reorder handle on each item row */
  .drag-handle {

  .items-edit-table tbody tr.drag-over-bottom td { box-shadow: inset 0 -2px 0 0 var(--accent-strong); }

  .add-row-btn {
    margin-top: 8px;

  .add-row-btn:hover { border-color: var(--accent-strong); background: var(--accent-soft); }

  .add-actions { display: flex; gap: 10px; margin-top: 6px; }

  /* ---------- Toast ---------- */
  #toast {

  footer.page { margin-top: 40px; text-align: center; color: var(--text-faint); font-size: 12px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }

  @media (max-width: 520px) {

  .auth-card input[type="email"], .auth-card input[type="password"] {

</style>

const fmtTWD = n => (n === null || n === undefined || n === "") ? null : "NT$" + Math.round(n).toLocaleString("en-US");
const fmtRMB = n => (n === null || n === undefined || n === "") ? null : "¥" + Math.round(n).toLocaleString("en-US");
const fmtQty = n => (n === null || n === undefined || n === "") ? null : Math.round(n).toLocaleString("en-US");
const esc = s => (s === null || s === undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 總金額／台幣單價 are derived from the item rows rather than typed in by
// hand: 總金額 = sum of every row's 台幣金額 (twd), 台幣單價 = 總金額 ÷ sum of
// every row's 數量 (q). Recomputed and written back onto the product
// whenever its items change, so state always carries the correct numbers
// (not just the on-screen display).
function recalcTotals(p) {
  const items = p.items || [];
  let totalSum = 0, qtySum = 0, hasTwd = false, hasQty = false;
  items.forEach(it => {
    const twd = Number(it.twd);
    if (it.twd !== null && it.twd !== undefined && it.twd !== "" && !Number.isNaN(twd)) { totalSum += twd; hasTwd = true; }
    const q = Number(it.q);
    if (it.q !== null && it.q !== undefined && it.q !== "" && !Number.isNaN(q)) { qtySum += q; hasQty = true; }
  });
  p.total = hasTwd ? totalSum : null;
  p.unit = (hasTwd && hasQty && qtySum !== 0) ? (totalSum / qtySum) : null;
}
const totalDisplayText = p => (p.total !== null && p.total !== undefined) ? fmtTWD(p.total) : "—";
const unitDisplayText = p => (p.unit !== null && p.unit !== undefined) ? ("NT$" + Number(p.unit).toFixed(2)) : "尚無單價";
function recalcAllTotals(list) { (list || []).forEach(recalcTotals); }

// DEV_VALUE is the sentinel stored in a dev-category product's `year` field.
// Kept as the original string on purpose: it's what's already saved in
// Firestore for existing products, and must never change just because the
// on-screen label changes. DEV_LABEL is only the *display* text shown to
// users — the two are intentionally decoupled so relabeling the UI never
// requires touching stored product data.
const DEV_VALUE = "開發中";
const DEV_LABEL = "進行中";
const isDevYear = y => y === DEV_VALUE;

// PAUSE_VALUE works the same way: the sentinel stored in a paused product's
// `year` field. Paused items are shown in their own collapsed section at the
// bottom of the page (closed by default) rather than inline with the normal
// year groups, since they're meant to stay out of the way until needed.
const PAUSE_VALUE = "暫停";
const PAUSE_LABEL = "暫停";
const isPauseYear = y => y === PAUSE_VALUE;

// Sort value used to order product groups: dev items always lead, then years
// descending, then paused items always trail at the very end.
const yearSortValue = y => {
  if (isDevYear(y)) return Infinity;
  if (isPauseYear(y)) return -Infinity;
  return Number.isFinite(Number(y)) ? Number(y) : -Infinity;
};

/* Resize + compress an uploaded image client-side into a small JPEG data URL,
   small enough that ~30-40 of them still comfortably fit inside a single
   Firestore document (1 MiB limit). Runs entirely in the browser — no
   upload/storage service required. */
function readAndCompressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type || !file.type.startsWith("image/")) { reject(new Error("not-image")); return; }
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("decode-failed")); };
    img.onload = () => {
      const maxDim = 400;
      let { width, height } = img;
      if (width >= height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
      else if (height > width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      const BUDGET = 32000; // chars — keeps each image comfortably under Firestore's document limit even with ~30-40 products
      let quality = 0.82;
      let dataUrl = canvas.toDataURL("image/jpeg", quality);
      while (dataUrl.length > BUDGET && quality > 0.5) {
        quality -= 0.08;
        dataUrl = canvas.toDataURL("image/jpeg", quality);
      }
      URL.revokeObjectURL(objectUrl);
      resolve(dataUrl);
    };
    img.src = objectUrl;
  });
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------------- VIEW MODE RENDER ---------------- */

function cell(content, cls) {
  if (content === null || content === undefined || content === "") return `<td class="${cls||''} empty">—</td>`;
  return `<td class="${cls||''}">${content}</td>`;
}

function renderItemsTable(p) {
  const rows = (p.items || []).map(it => `
    <tr>
      ${cell(esc(it.s), "stage")}
      ${cell(fmtQty(it.q), "num")}
      ${cell(fmtRMB(it.rmb), "num")}
      ${cell(fmtTWD(it.twd), "num")}
      ${cell(it.u !== null && typeof it.u === "number" ? fmtTWD(it.u) : (it.u ? esc(it.u) : null), "num")}
      ${cell(esc(it.d), "date")}
      ${cell(esc(it.n), "note")}
    </tr>`).join("");

  const totalUnit = (p.unit === null || p.unit === undefined || p.unit === "") ? "#DIV/0!" : "NT$" + Number(p.unit).toFixed(2);
  const unitEmphasisCls = (p.unit === null || p.unit === undefined || p.unit === "") ? "num" : "num unit-emphasis";

  return `
    <div class="table-scroll">
      <table class="items">
        <thead><tr>
          <th>階段 / 項目</th><th class="num">數量</th><th class="num">人民幣</th>
          <th class="num">台幣金額</th><th class="num">台幣單價</th><th>日期</th><th>備註</th>
        </tr></thead>
        <tbody>
          ${rows}
          <tr class="total-row">
            <td>總金額</td><td class="num"></td><td class="num"></td>
            <td class="num">${(p.total !== null && p.total !== undefined && p.total !== "") ? fmtTWD(p.total) : "—"}</td>
            <td class="${unitEmphasisCls}">${totalUnit}</td><td></td><td></td>
          </tr>
        </tbody>
      </table>
    </div>`;
}

function renderSpecsView(p) {
  const rows = p.specs || [];
  if (!rows.length) return "";
  const trs = rows.map(s => `
    <tr>
      ${cell(esc(s.moq), "num")}
      ${cell(esc(s.size))}
      ${cell(esc(s.material))}
      ${cell(esc(s.sampleCost), "num")}
      ${cell(esc(s.sampleDays), "num")}
      ${cell(esc(s.bulkDays), "num")}
      ${cell(esc(s.quote), "num")}
      ${cell(esc(s.note))}
    </tr>`).join("");

  return `
    <details class="spec-section">
      <summary class="spec-summary">
        <span class="spec-caret">▸</span>
        <span>細項說明</span>
        <span class="chip">${rows.length} 筆</span>
      </summary>
      <div class="spec-body">
        <div class="table-scroll">
          <table class="specs">
            <thead><tr>
              <th class="num">MOQ</th><th>尺寸</th><th>材質</th>
              <th class="num">打樣金額</th><th class="num">打樣天數</th><th class="num">大貨天數</th><th class="num">報價</th><th>備註</th>
            </tr></thead>
            <tbody>${trs}</tbody>
          </table>
        </div>
      </div>
    </details>`;
}

const EDIT_PENCIL_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
const GRIP_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>`;

function renderPCard(p, idx) {
  const unitMissing = (p.unit === null || p.unit === undefined || p.unit === "");
  const unitDisplay = unitMissing
    ? `<div class="price-primary missing">尚無單價</div>`
    : `<div class="price-primary">NT$${Number(p.unit).toFixed(2)}<span class="unit-suffix">/單位</span></div>`;
  const totalDisplay = (p.total !== null && p.total !== undefined && p.total !== "")
    ? `<span class="price-secondary">總額 ${fmtTWD(p.total)}</span>`
    : `<span class="price-secondary">總額 資料不完整</span>`;
  const noteBlock = p.note ? `<div class="card-note">${esc(p.note)}</div>` : "";
  const open = expandedAll ? "open" : "";
  const thumbHtml = p.img
    ? `<div class="pcard-thumb"><img src="${esc(p.img)}" alt="" loading="lazy"></div>`
    : `<div class="pcard-thumb">${IMG_PLACEHOLDER_SVG}</div>`;
  const devChip = isDevYear(p.year) ? `<span class="chip chip-dev">${DEV_LABEL}</span>` : "";
  const editBtn = currentUser
    ? `<button class="item-edit-btn" type="button" data-action="edit-item" data-idx="${idx}" title="編輯此產品">${EDIT_PENCIL_SVG}</button>`
    : "";

  return `
  <details class="pcard product-card" data-idx="${idx}" data-year="${esc(p.year)}" data-name="${esc((p.name||'').toLowerCase())}" ${open}>

      ${editBtn}
      ${thumbHtml}
      <span class="pcard-name">${esc(p.name) || "（未命名產品）"}</span>
      <span class="pcard-meta">${devChip}<span class="chip">${(p.items||[]).length} 筆明細</span></span>
      <span class="price-block">
        ${unitDisplay}
        ${totalDisplay}
      </span>
    </summary>
    <div class="card-body">
      ${noteBlock}
      ${renderItemsTable(p)}
      ${renderSpecsView(p)}
    </div>
  </details>`;
}

function groupedIndexesByYear() {
  const idxs = state.map((p, i) => i);
  idxs.sort((a, b) => yearSortValue(state[b].year) - yearSortValue(state[a].year));
  return idxs;
}

function renderPauseSection(idxs) {
  if (!idxs.length) return "";
  const containsEditing = editingIdx !== null && idxs.includes(editingIdx);
  const inner = idxs.map(idx => {
    const p = state[idx];
    return (idx === editingIdx) ? renderCardEdit(p, idx) : renderPCard(p, idx);
  }).join("");
  return `
  <details class="pause-section" data-section-year="${esc(PAUSE_VALUE)}" ${containsEditing ? "open" : ""}>
    <summary class="pause-summary">
      <span class="pause-caret">▸</span>
      <span>${PAUSE_LABEL}</span>
      <span class="chip">${idxs.length} 項</span>
    </summary>
    <div class="grid pause-grid">${inner}</div>
  </details>`;
}

function renderList() {
  const list = document.getElementById("list");
  const order = groupedIndexesByYear();
  let html = "";
  let lastYear = null;
  const pauseIdxs = [];
  order.forEach(idx => {
    const p = state[idx];
    // Paused items are collected separately and rendered as one collapsed
    // section at the end, instead of inline with the normal year groups.
    if (isPauseYear(p.year)) { pauseIdxs.push(idx); return; }
    if (p.year !== lastYear) {
      const label = isDevYear(p.year) ? DEV_LABEL : `年度：${esc(p.year)}`;
      html += `<div class="section-label" data-section-year="${esc(p.year)}">${label}</div>`;
      lastYear = p.year;
    }
    html += (idx === editingIdx) ? renderCardEdit(p, idx) : renderPCard(p, idx);
  });
  html += renderPauseSection(pauseIdxs);
  list.innerHTML = html;
  applyFilters();
}

/* ---------------- Stats / filters ---------------- */

function updateStats() {
  document.getElementById("stat-count").textContent = state.length;
  const devCount = state.filter(p => isDevYear(p.year)).length;
  document.getElementById("stat-dev").textContent = devCount;
  document.getElementById("footer-count").textContent = state.length;

  const yf = document.getElementById("yearFilter");
  const prevActive = yf.querySelector("button.active");
  const prevYear = prevActive ? prevActive.dataset.year : "all";
  const rawYears = [...new Set(state.map(p => p.year))];
  const years = rawYears.sort((a, b) => yearSortValue(b) - yearSortValue(a));
  const yearBtnLabel = y => isDevYear(y) ? DEV_LABEL : isPauseYear(y) ? PAUSE_LABEL : esc(y);
  let h = `<button data-year="all" class="${prevYear === 'all' ? 'active' : ''}">全部</button>`;
  years.forEach(y => { h += `<button data-year="${esc(y)}" class="${String(y) === prevYear ? 'active' : ''}">${yearBtnLabel(y)}</button>`; });
  if (!years.some(y => String(y) === prevYear) && prevYear !== 'all') {
    h = `<button data-year="all" class="active">全部</button>` + years.map(y => `<button data-year="${esc(y)}">${yearBtnLabel(y)}</button>`).join("");
  }
  yf.innerHTML = h;
}

function applyFilters() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const activeBtn = document.querySelector("#yearFilter button.active");
  const activeYear = activeBtn ? activeBtn.dataset.year : "all";

  let visibleCount = 0;
  document.querySelectorAll(".product-card").forEach(card => {
    const matchesText = !q || card.dataset.name.includes(q);
    const matchesYear = activeYear === "all" || card.dataset.year === activeYear;
    const show = matchesText && matchesYear;
    card.style.display = show ? "" : "none";
    if (show) visibleCount++;
  });

  document.querySelectorAll(".section-label").forEach(label => {
    const y = label.dataset.sectionYear;
    const anyVisible = [...document.querySelectorAll(`.product-card[data-year="${y}"]`)].some(c => c.style.display !== "none");
    label.style.display = anyVisible ? "" : "none";
  });

  // The paused-items section stays collapsed by default (native <details>
  // starts closed). Only force it open when the user explicitly filtered to
  // "暫停", or a search would otherwise hide a match behind the closed
  // section — never force it closed, so a manual click to open it isn't
  // fought on the next keystroke.
  const pauseSection = document.querySelector(".pause-section");
  if (pauseSection) {
    const anyVisibleInPause = [...pauseSection.querySelectorAll(".product-card")].some(c => c.style.display !== "none");
    pauseSection.style.display = anyVisibleInPause ? "" : "none";
    if (activeYear === PAUSE_VALUE || (!!q && anyVisibleInPause)) pauseSection.open = true;
  }

  document.getElementById("noResults").style.display = visibleCount === 0 ? "block" : "none";
}

/* ---------------- State mutation helpers ---------------- */

function markDirty() {
  dirty = true;
  document.getElementById("dirtyDot").style.display = "inline-block";
}

function coerceNum(v) {
  if (v === "" || v === null || v === undefined) return null;
  const n = Number(v);
  return Number.isNaN(n) ? null : n;
}

function wireEditDelegation() {
  const list = document.getElementById("list");

  /* ---- Drag-to-reorder item rows ---- */
  let dragState = null; // { pIdx, fromIdx } while a drag is in progress

  function clearDragVisuals() {
    document.querySelectorAll("tr.dragging").forEach(r => r.classList.remove("dragging"));
    document.querySelectorAll("tr.drag-over-top, tr.drag-over-bottom").forEach(r => r.classList.remove("drag-over-top", "drag-over-bottom"));
  }

  list.addEventListener("dragstart", e => {
    const handle = e.target.closest('[data-action="drag-handle"]');
    if (!handle) return;
    const rowEl = handle.closest("tr[data-item-idx]");
    const cardEl = handle.closest(".card-edit");
    if (!rowEl || !cardEl) return;
    dragState = { pIdx: Number(cardEl.dataset.idx), fromIdx: Number(rowEl.dataset.itemIdx) };
    rowEl.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", String(dragState.fromIdx)); } catch (err) {}
    // Use the whole row (not just the tiny grip icon) as the drag preview image.
    const rect = rowEl.getBoundingClientRect();
    try { e.dataTransfer.setDragImage(rowEl, e.clientX - rect.left, e.clientY - rect.top); } catch (err) {}
  });

  list.addEventListener("dragover", e => {
    if (!dragState) return;
    const rowEl = e.target.closest("tr[data-item-idx]");
    if (!rowEl) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    document.querySelectorAll("tr.drag-over-top, tr.drag-over-bottom").forEach(r => r.classList.remove("drag-over-top", "drag-over-bottom"));
    const rect = rowEl.getBoundingClientRect();
    const isTopHalf = (e.clientY - rect.top) < rect.height / 2;
    rowEl.classList.add(isTopHalf ? "drag-over-top" : "drag-over-bottom");
  });

  list.addEventListener("drop", e => {
    if (!dragState) return;
    const rowEl = e.target.closest("tr[data-item-idx]");
    if (!rowEl) { clearDragVisuals(); dragState = null; return; }
    e.preventDefault();
    const cardEl = rowEl.closest(".card-edit");
    const pIdx = cardEl ? Number(cardEl.dataset.idx) : null;
    clearDragVisuals();
    if (pIdx !== dragState.pIdx) { dragState = null; return; }
    const rect = rowEl.getBoundingClientRect();
    const isTopHalf = (e.clientY - rect.top) < rect.height / 2;
    const overIdx = Number(rowEl.dataset.itemIdx);
    let toIdx = isTopHalf ? overIdx : overIdx + 1;
    const { fromIdx } = dragState;
    dragState = null;
    if (toIdx === fromIdx || toIdx === fromIdx + 1) return; // dropped back where it started
    const items = state[pIdx].items;
    const [moved] = items.splice(fromIdx, 1);
    if (toIdx > fromIdx) toIdx -= 1; // account for the shift caused by removing the source row
    items.splice(toIdx, 0, moved);
    markDirty();
    renderList();
  });

  list.addEventListener("dragend", () => { clearDragVisuals(); dragState = null; });

  list.addEventListener("input", e => {
    const t = e.target;
    if (!t.matches(".ipt")) return;
    const field = t.dataset.field;
    if (!field) return;

    const cardEl = t.closest(".card-edit");
    if (!cardEl) return;
    const pIdx = Number(cardEl.dataset.idx);
    const p = state[pIdx];
    const rowEl = t.closest("tr[data-item-idx]");
    const specRowEl = t.closest("tr[data-spec-idx]");

    if (rowEl) {
      const iIdx = Number(rowEl.dataset.itemIdx);
      const numeric = ["q", "rmb", "twd"].includes(field);
      p.items[iIdx][field] = numeric ? coerceNum(t.value) : (t.value === "" ? null : t.value);
      if (field === "u") {
        const n = Number(t.value);
        p.items[iIdx].u = t.value === "" ? null : (Number.isNaN(n) ? t.value : n);
      }
      if (field === "q" || field === "twd") {
        // 總金額／台幣單價 are derived from the item rows — recompute them and
        // update the read-only displays directly (no renderList(), so the
        // input the user is actively typing in never loses focus).
        recalcTotals(p);
        const totalEl = document.getElementById(`totalCalc-${pIdx}`);
        const unitEl = document.getElementById(`unitCalc-${pIdx}`);
        if (totalEl) totalEl.textContent = totalDisplayText(p);
        if (unitEl) unitEl.textContent = unitDisplayText(p);
      }
    } else if (specRowEl) {
      // "細項說明" rows (MOQ/尺寸/材質/打樣天數/大貨天數/報價/備註) are kept as
      // free-text fields — no numeric coercion, since values like "5-7天" or
      // "NT$500起" are expected here.
      const sIdx = Number(specRowEl.dataset.specIdx);
      p.specs = p.specs || [];
      p.specs[sIdx] = p.specs[sIdx] || {};
      p.specs[sIdx][field] = t.value === "" ? null : t.value;
    } else {
      if (field === "year") { const n = coerceNum(t.value); if (n !== null) { p.year = n; cardEl.dataset.year = p.year; } }
      else { p[field] = t.value === "" ? null : t.value; if (field === "name") cardEl.dataset.name = (t.value||"").toLowerCase(); }
    }
    markDirty();
  });

  list.addEventListener("change", async e => {
    const fileInput = e.target.closest('input[data-action="upload-img"]');
    if (fileInput) {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const cardEl = fileInput.closest(".card-edit");
      const pIdx = Number(cardEl.dataset.idx);
      try {
        toast("圖片處理中…");
        const dataUrl = await readAndCompressImage(file);
        state[pIdx].img = dataUrl;
        markDirty();
        renderList();
      } catch (err) {
        console.error(err);
        toast("圖片處理失敗，請換一張圖片再試");
      }
      return;
    }

    const devToggle = e.target.closest('input[data-action="toggle-dev"]');
    if (devToggle) {
      const cardEl = devToggle.closest(".card-edit");
      const pIdx = Number(cardEl.dataset.idx);
      const p = state[pIdx];
      p.year = devToggle.checked ? DEV_VALUE : new Date().getFullYear();
      markDirty();
      renderList();
      return;
    }

    const pauseToggle = e.target.closest('input[data-action="toggle-pause"]');
    if (pauseToggle) {
      const cardEl = pauseToggle.closest(".card-edit");
      const pIdx = Number(cardEl.dataset.idx);
      const p = state[pIdx];
      // `year` only holds one value at a time, so checking "暫停" here
      // automatically supersedes an existing "進行中" flag (and vice versa) —
      // no separate bookkeeping needed to keep the two mutually exclusive.
      p.year = pauseToggle.checked ? PAUSE_VALUE : new Date().getFullYear();
      markDirty();
      renderList();
      return;
    }
  });

  list.addEventListener("click", e => {
    const editItemBtn = e.target.closest('[data-action="edit-item"]');
    if (editItemBtn) {
      e.preventDefault();
      e.stopPropagation();
      editingIdx = Number(editItemBtn.dataset.idx);
      renderList();
      return;
    }

    const closeEditBtn = e.target.closest('[data-action="close-edit"]');
    if (closeEditBtn) {
      editingIdx = null;
      if (pendingRemoteState) {
        state = pendingRemoteState;
        recalcAllTotals(state);
        pendingRemoteState = null;
        toast("已套用雲端最新版本");
      }
      renderList();
      return;
    }

    const removeImgBtn = e.target.closest('[data-action="remove-img"]');
    if (removeImgBtn) {
      const cardEl = removeImgBtn.closest(".card-edit");
      const pIdx = Number(cardEl.dataset.idx);
      state[pIdx].img = null;
      markDirty();
      renderList();
      return;
    }

    const addItemBtn = e.target.closest('[data-action="add-item"]');
    if (addItemBtn) {
      const cardEl = addItemBtn.closest(".card-edit");
      const pIdx = Number(cardEl.dataset.idx);
      state[pIdx].items = state[pIdx].items || [];
      state[pIdx].items.push({s: "", q: null, rmb: null, twd: null, u: null, d: "", n: ""});
      markDirty();
      renderList();
      return;
    }

    const delItemBtn = e.target.closest('[data-action="del-item"]');
    if (delItemBtn) {
      if (!delItemBtn.classList.contains("confirm")) {
        delItemBtn.classList.add("confirm");
        setTimeout(() => delItemBtn.classList.remove("confirm"), 3000);
        return;
      }
      const cardEl = delItemBtn.closest(".card-edit");
      const pIdx = Number(cardEl.dataset.idx);
      const rowEl = delItemBtn.closest("tr[data-item-idx]");
      const iIdx = Number(rowEl.dataset.itemIdx);
      state[pIdx].items.splice(iIdx, 1);
      recalcTotals(state[pIdx]);
      markDirty();
      renderList();
      return;
    }

    const addSpecBtn = e.target.closest('[data-action="add-spec"]');
    if (addSpecBtn) {
      const cardEl = addSpecBtn.closest(".card-edit");
      const pIdx = Number(cardEl.dataset.idx);
      state[pIdx].specs = state[pIdx].specs || [];
      state[pIdx].specs.push({moq: null, size: null, material: null, sampleCost: null, sampleDays: null, bulkDays: null, quote: null, note: null});
      markDirty();
      renderList();
      return;
    }

    const delSpecBtn = e.target.closest('[data-action="del-spec"]');
    if (delSpecBtn) {
      if (!delSpecBtn.classList.contains("confirm")) {
        delSpecBtn.classList.add("confirm");
        setTimeout(() => delSpecBtn.classList.remove("confirm"), 3000);
        return;
      }
      const cardEl = delSpecBtn.closest(".card-edit");
      const pIdx = Number(cardEl.dataset.idx);
      const rowEl = delSpecBtn.closest("tr[data-spec-idx]");
      const sIdx = Number(rowEl.dataset.specIdx);
      state[pIdx].specs.splice(sIdx, 1);
      markDirty();
      renderList();
      return;
    }

    const delProductBtn = e.target.closest('[data-action="del-product"]');
    if (delProductBtn) {
      if (!delProductBtn.classList.contains("confirm")) {
        delProductBtn.classList.add("confirm");
        delProductBtn.title = "再按一次以確認刪除";
        setTimeout(() => { delProductBtn.classList.remove("confirm"); delProductBtn.title = "刪除此產品"; }, 3000);
        return;
      }
      const cardEl = delProductBtn.closest(".card-edit");
      const pIdx = Number(cardEl.dataset.idx);
      state.splice(pIdx, 1);
      editingIdx = null;
      markDirty();
      renderList();
      updateStats();
      return;
    }
  });
}

// Every newly-added product starts pre-populated with these 7 standard cost
// stages, in this order, so nobody has to retype them by hand each time.
const DEFAULT_ITEM_STAGES = ["sample", "打樣", "運費", "大貨", "運費(到集運)", "運費(到台灣)", "關稅"];

function addProduct(yearOverride) {
  const year = yearOverride ?? new Date().getFullYear();
  state.push({
    name: "",
    year: year,
    total: null,
    unit: null,
    note: null,
    img: null,
    items: DEFAULT_ITEM_STAGES.map(s => ({s, q: null, rmb: null, twd: null, u: null, d: "", n: ""})),
    specs: []
  });
  const newIdx = state.length - 1;
  editingIdx = newIdx;
  markDirty();
  document.getElementById("searchInput").value = "";
  renderList();
  updateStats();
  requestAnimationFrame(() => {
    const card = document.querySelector(`.card-edit[data-idx="${newIdx}"]`);
    if (card) { card.scrollIntoView({behavior: "smooth", block: "center"}); const inp = card.querySelector('input[data-field="name"]'); if (inp) inp.focus(); }
  });
}

function addYear() {
  const years = state.map(p => Number(p.year)).filter(y => !Number.isNaN(y));
  const nextYear = years.length ? Math.max(...years) + 1 : new Date().getFullYear();
  addProduct(nextYear);
  toast(`已建立年度 ${nextYear}，請填寫第一項產品`);
}

function addDevProduct() {
  addProduct(DEV_VALUE);
  toast(`已建立「${DEV_LABEL}」項目，請填寫產品資訊`);
}

function addPauseProduct() {
  addProduct(PAUSE_VALUE);
  toast(`已建立「${PAUSE_LABEL}」項目，請填寫產品資訊`);
}

/* ---------------- Auth ---------------- */

function openAuthModal() {
  document.getElementById("authError").textContent = "";
  document.getElementById("authOverlay").classList.add("show");
}

function closeAuthModal() {
  document.getElementById("authOverlay").classList.remove("show");
}

async function handleAuthSubmit() {
  if (!firebaseReady || !auth) {
    document.getElementById("authError").textContent = "尚未設定 Firebase，請參考架設教學完成設定。";
    return;
  }
  const btn = document.getElementById("authSubmitBtn");
  const label = document.getElementById("authSubmitLabel");
  document.getElementById("authError").textContent = "";
  btn.disabled = true;
  label.textContent = "登入中…";
  try {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
    closeAuthModal();
  } catch (err) {
    const code = err && err.code;
    let msg = "登入失敗，請再試一次。";
    if (code === "auth/popup-closed-by-user") msg = "登入視窗已關閉，請再試一次。";
    else if (code === "auth/popup-blocked") msg = "瀏覽器封鎖了登入彈出視窗，請允許彈出視窗後再試一次。";
    else if (code === "auth/unauthorized-domain") msg = "此網域尚未被 Firebase 授權登入，請聯絡管理員設定。";
    document.getElementById("authError").textContent = msg;
  } finally {
    btn.disabled = false;
    label.textContent = "使用 Google 帳號登入";
  }
}

function updateAuthUI(user) {
  currentUser = user || null;
  const userBadge = document.getElementById("userBadge");
  const loginBtn = document.getElementById("loginBtn");
  const saveBtn = document.getElementById("saveBtn");
  const addActions = document.getElementById("addActions");
  if (currentUser) {
    userBadge.style.display = "flex";
    document.getElementById("userEmail").textContent = currentUser.email || "";
    loginBtn.style.display = "none";
    saveBtn.style.display = "inline-flex";
    addActions.style.display = "flex";
  } else {
    userBadge.style.display = "none";
    loginBtn.style.display = "inline-flex";
    saveBtn.style.display = "none";
    addActions.style.display = "none";
    editingIdx = null;
    if (pendingRemoteState) {
      state = pendingRemoteState;
      recalcAllTotals(state);
      pendingRemoteState = null;
    }
  }
  renderList();
}

/* ---------------- Save / cloud sync ---------------- */

function setSaving(v) {
  saving = v;
  const btn = document.getElementById("saveBtn");
  const label = document.getElementById("saveBtnLabel");
  btn.disabled = v;
  label.innerHTML = v ? '<span class="spinner"></span> 儲存中…' : "儲存變更";
}

function setSyncStatus(mode, text) {
  const dot = document.getElementById("syncDot");
  const label = document.getElementById("syncText");
  dot.classList.remove("offline", "syncing");
  if (mode === "offline") dot.classList.add("offline");
  else if (mode === "syncing") dot.classList.add("syncing");
  label.textContent = text;
}

async function handleSave() {
  if (saving) return;
  if (!firebaseReady || !db || !docRef) { toast("尚未設定 Firebase，無法儲存到雲端"); return; }
  if (!currentUser) { toast("請先登入才能儲存"); openAuthModal(); return; }

  // Firestore documents are capped at 1 MiB; product images are the only
  // field that can grow large, so check before attempting the write rather
  // than letting it fail server-side with a cryptic error.
  const payloadBytes = new TextEncoder().encode(JSON.stringify({ products: state })).length;
  if (payloadBytes > 900000) {
    toast("資料量過大（可能是圖片太多），請移除部分產品圖片後再儲存");
    return;
  }

  setSaving(true);
  try {
    await setDoc(docRef, { products: state, updatedAt: serverTimestamp() });
    dirty = false;
    document.getElementById("dirtyDot").style.display = "none";
    toast("已儲存並同步至雲端");
  } catch (err) {
    console.error(err);
    const code = err && err.code;
    if (code === "permission-denied") {
      toast("此 Google 帳號沒有編輯權限，請確認是否為管理員授權的帳號");
    } else if (code === "invalid-argument" || /longer than|exceeds|too large/i.test((err && err.message) || "")) {
      toast("儲存失敗：資料量超過雲端資料庫上限，請移除部分產品圖片後再試");
    } else {
      toast("儲存失敗，請確認網路連線後再試");
    }
  } finally {
    setSaving(false);
  }
}

function subscribeCloud() {
  if (!firebaseReady || !db || !docRef) {
    setSyncStatus("offline", "離線模式（尚未設定 Firebase，僅顯示內建資料）");
    return;
  }
  setSyncStatus("syncing", "連線中…");
  onSnapshot(docRef, (snap) => {
    if (saving) return; // ignore the optimistic local echo of our own in-flight write
    if (snap.exists()) {
      const data = snap.data();
      if (data && Array.isArray(data.products)) {
        if (editingIdx !== null) {
          // don't disturb a product that's actively being edited; apply once it's closed
          pendingRemoteState = data.products;
          if (dirty) toast("雲端有新版本，完成編輯後將自動套用");
        } else {
          state = data.products;
          recalcAllTotals(state);
          pendingRemoteState = null;
          renderList();
          updateStats();
        }
      }
    } else {
      toast("尚未建立雲端資料，登入後按「儲存變更」即可將目前資料建立為雲端版本");
    }
    setSyncStatus("online", "即時同步中");
  }, (err) => {
    console.error(err);
    setSyncStatus("offline", "雲端連線失敗（離線顯示本機資料）");
  });
}

/* ---------------- Wiring ---------------- */

function wireControls() {
  document.getElementById("searchInput").addEventListener("input", applyFilters);
  document.getElementById("yearFilter").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    document.querySelectorAll("#yearFilter button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    applyFilters();
  });
  document.getElementById("toggleAllBtn").addEventListener("click", () => {
    expandedAll = !expandedAll;
    document.querySelectorAll(".pcard").forEach(c => { c.open = expandedAll; });
    document.getElementById("toggleAllBtn").textContent = expandedAll ? "全部收合" : "全部展開";
  });

  document.getElementById("loginBtn").addEventListener("click", openAuthModal);
  document.getElementById("saveBtn").addEventListener("click", handleSave);
  document.getElementById("addProductBtn").addEventListener("click", () => addProduct());
  document.getElementById("addYearBtn").addEventListener("click", addYear);
  document.getElementById("addDevBtn").addEventListener("click", addDevProduct);
  document.getElementById("addPauseBtn").addEventListener("click", addPauseProduct);

  document.getElementById("authCancelBtn").addEventListener("click", closeAuthModal);
  document.getElementById("authSubmitBtn").addEventListener("click", handleAuthSubmit);
  document.getElementById("authOverlay").addEventListener("click", (e) => {
    if (e.target.id === "authOverlay") closeAuthModal();
  });
  document.getElementById("signOutBtn").addEventListener("click", async () => {
    if (dirty && !confirm("有尚未儲存的變更，確定要登出嗎？（變更會保留在畫面上，直到您按下「儲存變更」或重新整理頁面）")) return;
    if (auth) { try { await signOut(auth); } catch (e) { console.error(e); } }
    toast("已登出");
  });

  wireEditDelegation();
}

document.addEventListener("DOMContentLoaded", async () => {
  // Render immediately from the embedded PRODUCTS_INITIAL data so the page
  // is fully usable the instant it loads, before Firebase (if any) responds.
  renderList();
  updateStats();
  wireControls();
  updateAuthUI(null);

  if (!firebaseConfigFilled) {
    setSyncStatus("offline", "離線模式（尚未設定 Firebase，僅顯示內建資料）");
    return;
  }

  setSyncStatus("syncing", "連線中…");
  const sdkOk = await loadFirebaseSDK();
  if (!sdkOk) {
    setSyncStatus("offline", "離線模式（無法連線至 Firebase 服務，僅顯示本機資料）");
    return;
  }

  try {
    firebaseApp = initializeApp(firebaseConfig);
    auth = getAuth(firebaseApp);
    db = getFirestore(firebaseApp);
    docRef = doc(db, FIRESTORE_COLLECTION, FIRESTORE_DOC);
    firebaseReady = true;
  } catch (e) {
    console.error("Firebase init failed", e);
    firebaseReady = false;
  }

  if (firebaseReady) {
    onAuthStateChanged(auth, (user) => updateAuthUI(user));
    subscribeCloud();
  } else {
    setSyncStatus("offline", "離線模式（Firebase 初始化失敗，僅顯示本機資料）");
  }
});
</script>
